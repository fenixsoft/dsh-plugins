# =============================================================================
# .fenix/verify.yaml — 声明式验证契约
# 起草：Administrator（spec=add-cc-import-plugin 前置预检 verify_contract_missing）
#
# 项目形态：dsh 第三方插件集仓库。交付物 cc-import 为 TypeScript 插件包
# （tsdown 构建 + vitest 单测，纯 CLI 交付）；真实 dsh web 端到端为人工步骤
# （docs/help/cc-import-install.md），本仓库无可服务的 HTTP 形态——
# 纯 cli 场景集 → serve/ready 全省（不回退 commands.start，见 core/verify_contract.py）。
# regression 段暂缺：vitest 测试体系随 cc-import/ 实现落地后再补
# （现臆造命令必失败，会让周期回归每天 parse_error 空转，比不配更糟）。
# =============================================================================

prepare:
  - run: |
      if [ ! -f cc-import/package.json ]; then
        echo "[verify-contract] cc-import/ 插件包未落地，跳过构建（包本体缺失由验证场景直接暴露）"
        exit 0
      fi
      pnpm --dir cc-import install
      pnpm --dir cc-import run build
